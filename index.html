<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NETFIX</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <!-- High-Speed Video Streaming Preconnections & DNS-Prefetching -->
  <link rel="preconnect" href="https://drive.google.com" crossorigin>
  <link rel="preconnect" href="https://video-downloads.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://ssl.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://drive.google.com">
  <link rel="dns-prefetch" href="https://video-downloads.googleusercontent.com">
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
  
  <!-- Google Font: Strait -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Strait&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            'xs': '420px',
          },
          fontFamily: {
            strait: ['Strait', 'sans-serif'],
          },
          colors: {
            netfixRed: '#E50914',
            mintBadge: '#00f5d4',
            darkBg: '#0f0f0f',
            cardBg: '#181818',
            cardBorder: '#272727'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --app-dvh: 100dvh;
    }
    @supports not (height: 100dvh) {
      :root {
        --app-dvh: 100vh;
      }
    }
    /* Dynamic Player Sizing: mathematically ensures 16:9 ratio NEVER overflows viewport height in landscape or portrait */
    .player-box {
      width: 100%;
      max-width: min(98vw, 1280px, calc((var(--app-dvh) - 100px) * 16 / 9));
      aspect-ratio: 16 / 9;
      height: auto;
      max-height: calc(var(--app-dvh) - 100px);
      transform: translateZ(0);
    }
    /* Fullscreen Theater Mode */
    .player-box.is-theater {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100dvh !important;
      max-height: 100dvh !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 60 !important;
      aspect-ratio: auto !important;
    }
    /* Safe Area Insets for notched phones (iPhone, Galaxy S series, Pixel) */
    .safe-modal {
      padding-top: max(0.5rem, env(safe-area-inset-top));
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      padding-left: max(0.5rem, env(safe-area-inset-left));
      padding-right: max(0.5rem, env(safe-area-inset-right));
    }
    /* Smooth custom scrollbars */
    #playerModal::-webkit-scrollbar {
      width: 4px;
    }
    #playerModal::-webkit-scrollbar-thumb {
      background: #272727;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-netfixRed selection:text-white">

  <!-- Header -->
  <header class="w-full border-b border-cardBorder bg-black/60 backdrop-blur-md sticky top-0 z-40 px-4 sm:px-6 py-3.5 sm:py-4 flex items-center justify-between">
    <div class="flex items-center">
      <h1 class="font-strait text-3xl sm:text-5xl tracking-widest text-netfixRed font-bold select-none cursor-pointer">
        NETFIX
      </h1>
    </div>
  </header>

  <!-- Fullscreen Modal Video Player (Clean centered theater experience) -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-black/95 sm:bg-[#0d0d0d]/95 backdrop-blur-md flex flex-col items-center justify-start sm:justify-center p-1.5 sm:p-4 overflow-y-auto overflow-x-hidden safe-modal hidden">
    
    <!-- Player Content Wrapper with dynamic responsive sizing -->
    <div id="playerContentWrapper" class="w-full flex flex-col items-center my-auto transition-all duration-200">
      
      <!-- Top Bar inside modal -->
      <div id="playerTopBar" class="w-full max-w-[min(98vw,1280px,calc((var(--app-dvh)-100px)*16/9))] flex items-center justify-between mb-2 px-1">
        <div class="flex items-center gap-2 overflow-hidden mr-2 min-w-0 flex-1">
          <i data-lucide="monitor-smartphone" class="w-4 h-4 sm:w-5 sm:h-5 text-netfixRed shrink-0"></i>
          <span id="playingTitle" class="text-xs sm:text-base font-semibold truncate text-zinc-100 font-sans flex items-center"></span>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <!-- Direct External Google Drive fallback button -->
          <a id="openDriveLink" href="#" target="_blank" rel="noopener noreferrer" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 hover:text-white transition-colors flex items-center gap-1 text-xs sm:text-sm font-medium border border-cardBorder cursor-pointer whitespace-nowrap" title="Open in Google Drive App for native hardware playback">
            <i data-lucide="external-link" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            <span class="hidden xs:inline sm:inline">Drive App</span>
          </a>
          <!-- Theater / Fullscreen toggle button -->
          <button id="theaterToggleBtn" class="px-2 sm:px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 hover:text-white transition-colors flex items-center gap-1 text-xs sm:text-sm font-medium border border-cardBorder cursor-pointer" title="Toggle Fullscreen Theater Mode">
            <i id="theaterIcon" data-lucide="maximize" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            <span id="theaterLabel" class="hidden sm:inline">Theater</span>
          </button>
          <!-- Close button -->
          <button id="closePlayerBtn" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 hover:text-white transition-colors flex items-center gap-1 text-xs sm:text-sm font-medium border border-cardBorder cursor-pointer">
            <i data-lucide="x" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            <span>Close</span>
          </button>
        </div>
      </div>

      <!-- Centered 16:9 Custom Player Container with Dynamic Fit -->
      <div id="videoContainer" class="player-box relative rounded-xl overflow-hidden shadow-2xl border border-zinc-800 bg-black flex items-center justify-center transition-all duration-200">
        
        <!-- Floating exit button for theater mode -->
        <button id="theaterCloseFloatingBtn" class="hidden absolute top-3 right-3 z-30 p-2.5 rounded-full bg-black/80 hover:bg-zinc-800 text-white border border-zinc-700 shadow-xl cursor-pointer backdrop-blur-md" title="Exit Theater Mode">
          <i data-lucide="minimize" class="w-5 h-5"></i>
        </button>

        <!-- Fast loading indicator with animated spinner & slow network assistant -->
        <div id="playerSpinner" class="absolute inset-0 flex flex-col items-center justify-center gap-2.5 text-zinc-400 bg-black/95 z-20 transition-opacity duration-300">
          <div class="relative flex items-center justify-center">
            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-zinc-800 border-t-netfixRed animate-spin"></div>
            <i data-lucide="play" class="w-4 h-4 sm:w-5 sm:h-5 text-netfixRed absolute fill-current"></i>
          </div>
          <span id="playerStatusText" class="text-xs sm:text-sm font-medium tracking-wide text-zinc-300">Connecting fast video stream...</span>
          <span class="text-[11px] text-zinc-500">Hardware acceleration active</span>
          
          <!-- Automatic slow-network helper appeared after 3.5s -->
          <div id="slowNetworkNotice" class="hidden mt-1 flex flex-wrap items-center justify-center gap-2 px-3 py-1.5 rounded-lg bg-zinc-900/90 border border-zinc-700/80 text-[11px] text-zinc-300 max-w-[90%] text-center">
            <span>Taking longer than usual?</span>
            <a id="spinnerDriveLink" href="#" target="_blank" class="text-netfixRed hover:underline font-semibold flex items-center gap-1">
              <i data-lucide="external-link" class="w-3 h-3"></i> Drive App
            </a>
            <span class="text-zinc-600">|</span>
            <a id="spinnerVlcLink" href="#" class="text-amber-400 hover:underline font-semibold flex items-center gap-1">
              <i data-lucide="play" class="w-3 h-3"></i> External App
            </a>
          </div>
        </div>

        <!-- Iframe Player: Full permissions for hardware acceleration, uninhibited by sandbox -->
        <iframe
          id="videoPlayer"
          class="relative z-10 w-full h-full border-0 rounded-xl"
          src="about:blank"
          title="Video player"
          referrerpolicy="no-referrer"
          loading="eager"
          allow="autoplay *; fullscreen *; encrypted-media *; picture-in-picture *; accelerometer *; gyroscope *"
          allowfullscreen>
        </iframe>
      </div>

      <!-- Mobile-Friendly Direct Streaming Hint / Fallback Bar -->
      <div id="playerBottomBar" class="w-full max-w-[min(98vw,1280px,calc((var(--app-dvh)-100px)*16/9))] mt-2 px-1 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-zinc-400">
        <div class="flex items-center gap-1.5 text-center sm:text-left">
          <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-500 shrink-0"></i>
          <span>Mobile tip: Tap play inside player or tap <strong>Drive App</strong> for instant hardware stream.</span>
        </div>
        <div class="flex items-center gap-3">
          <a id="vlcIntentLink" href="#" class="text-zinc-300 hover:text-netfixRed transition-colors underline flex items-center gap-1" title="Open in VLC on Android">
            <i data-lucide="play" class="w-3 h-3 text-netfixRed"></i> Open in VLC
          </a>
          <span class="text-zinc-600">|</span>
          <a id="genericIntentLink" href="#" class="text-zinc-300 hover:text-netfixRed transition-colors underline flex items-center gap-1" title="Open in MX Player, Just Player, MPV, or Samsung Video">
            <i data-lucide="external-link" class="w-3 h-3 text-amber-400"></i> Other Video Apps
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">

    <!-- Section Header: Trending Now with library-big icon -->
    <div class="flex items-center justify-between mb-6 pb-2 border-b border-cardBorder/60">
      <div class="flex items-center gap-2.5">
        <i data-lucide="library-big" class="w-5 h-5 text-netfixRed"></i>
        <h2 class="text-lg font-semibold tracking-wide text-zinc-300 uppercase">Trending Now</h2>
      </div>
      <span id="fileCountBadge" class="text-xs font-mono bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full border border-cardBorder">0 files</span>
    </div>

    <!-- List of File Names -->
    <div id="fileList" class="flex flex-col gap-2.5">
      <!-- File items will render here dynamically in Drive timestamp sequence -->
    </div>
  </main>

  <script>
    // Verified active files from your Google Drive folder in Drive timestamp sequence
    const DEFAULT_FILES = [
      {
            "id": "1K6QUnhib74SQiJvlBMDBBHVb0PKXpgty",
            "name": "The Paradise 2026 (HI).mkv",
            "size": "1.71 GB",
            "mimeType": "video/x-matroska",
            "timestamp": 1793599079964,
            "createdTime": 1793599079964,
            "modifiedTime": 1793598459617
      },
      {
            "id": "1sFUFsRvkjOuevc6cKuBBwklX86GrmivZ",
            "name": "Aankh Micholi 2023 (HI).mkv",
            "size": "1.22 GB",
            "mimeType": "video/x-matroska",
            "timestamp": 1793597946636,
            "createdTime": 1793597946636,
            "modifiedTime": 1793597050024
      },
      {
            "id": "1zTtBzD1i1pCQW1RnXyIH2AL2ydSpXMej",
            "name": "Bol Bol Rani 2026 (MR).mp4",
            "size": "1.10 GB",
            "mimeType": "video/mp4",
            "timestamp": 1793594179481,
            "createdTime": 1793594179481,
            "modifiedTime": 1793593312917
      },
      {
            "id": "10qCuiUqNeda7JpczgpW2LluKJBlKImWl",
            "name": "Salbardi 2026 (MR).mkv",
            "size": "1.45 GB",
            "mimeType": "video/x-matroska",
            "timestamp": 1793593922546,
            "createdTime": 1793593922546,
            "modifiedTime": 1793592718158
      },
      {
            "id": "1JTLaNIlEKRhmKttO2p8Kf46SUj2uY2bu",
            "name": "Reporting Live 2026 (HI).mkv",
            "size": "972.1 MB",
            "mimeType": "video/x-matroska",
            "timestamp": 1793592437565,
            "createdTime": 1793592437565,
            "modifiedTime": 1793592017577
      },
      {
            "id": "1WlcrBRKLEQibT0_4hR3N0ilGbKj1970A",
            "name": "Mirzapur The Movie 2026 (HI).mkv",
            "size": "1.11 GB",
            "mimeType": "video/x-matroska",
            "timestamp": 1793346845563,
            "createdTime": 1793346845563,
            "modifiedTime": 1793592110867
      }
];

    // Language Dictionary
    const LANGUAGE_MAP = {
      'HI': 'HINDI',
      'HINDI': 'HINDI',
      'HINIDI': 'HINDI',
      'EN': 'ENGLISH',
      'ENG': 'ENGLISH',
      'ENGLISH': 'ENGLISH',
      'MR': 'MARATHI',
      'MARATHI': 'MARATHI',
      'FR': 'FOREIGN',
      'FOREIGN': 'FOREIGN'
    };

    // Parse filename to extract language code & format clean title
    // Example: "Mirzapur The Movie 2026 (HI).mkv" => title: "Mirzapur The Movie 2026.mkv", language: "HINDI"
    function parseFileInfo(filename) {
      if (!filename) return { title: '', language: null };

      const langRegex = /\s*[\(\[](HI|HINDI|HINIDI|EN|ENG|ENGLISH|MR|MARATHI|FR|FOREIGN)[\)\]]\s*/i;
      const match = filename.match(langRegex);

      if (match) {
        const rawKey = match[1].toUpperCase();
        const language = LANGUAGE_MAP[rawKey] || rawKey;
        const title = filename
          .replace(langRegex, ' ')
          .replace(/\s+(\.[a-z0-9]+)$/i, (m, ext) => ext)
          .replace(/\s+/g, ' ')
          .trim();
        return { title, language };
      }

      return { title: filename.trim(), language: null };
    }

    // Sort files strictly by timestamp from Google Drive (newest timestamp first)
    function sortFilesByTimestamp(files) {
      if (!Array.isArray(files)) return [];
      return files.slice().sort((a, b) => {
        const tA = Number(a.timestamp || a.createdTime || 0);
        const tB = Number(b.timestamp || b.createdTime || 0);
        return tB - tA;
      });
    }

    // LocalStorage initialization - strictly purges all player progress / resume timeline storage
    function getStoredFiles() {
      try {
        localStorage.removeItem('netfix_last_played');
        localStorage.removeItem('netfix_watch_progress');
        localStorage.removeItem('fc_recent_watched');

        const cached = localStorage.getItem('netfix_files');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return sortFilesByTimestamp(parsed);
          }
        }
        localStorage.setItem('netfix_files', JSON.stringify(sortFilesByTimestamp(DEFAULT_FILES)));
      } catch (e) {}
      return sortFilesByTimestamp(DEFAULT_FILES);
    }

    let currentFiles = getStoredFiles();

    const fileListEl = document.getElementById('fileList');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const playerModal = document.getElementById('playerModal');
    const videoContainer = document.getElementById('videoContainer');
    const videoPlayer = document.getElementById('videoPlayer');
    const playingTitle = document.getElementById('playingTitle');
    const closePlayerBtn = document.getElementById('closePlayerBtn');
    const openDriveLink = document.getElementById('openDriveLink');
    const vlcIntentLink = document.getElementById('vlcIntentLink');
    const genericIntentLink = document.getElementById('genericIntentLink');
    const playerSpinner = document.getElementById('playerSpinner');
    const slowNetworkNotice = document.getElementById('slowNetworkNotice');
    const spinnerDriveLink = document.getElementById('spinnerDriveLink');
    const spinnerVlcLink = document.getElementById('spinnerVlcLink');
    const theaterToggleBtn = document.getElementById('theaterToggleBtn');
    const theaterCloseFloatingBtn = document.getElementById('theaterCloseFloatingBtn');
    const theaterIcon = document.getElementById('theaterIcon');
    const theaterLabel = document.getElementById('theaterLabel');
    const playerTopBar = document.getElementById('playerTopBar');
    const playerBottomBar = document.getElementById('playerBottomBar');

    // Dynamic Viewport Dimensions Synchronizer (Handles orientation changes & mobile dynamic toolbars)
    function syncViewportDimensions() {
      const vh = window.innerHeight;
      document.documentElement.style.setProperty('--app-dvh', `${vh}px`);
    }
    window.addEventListener('resize', syncViewportDimensions, { passive: true });
    window.addEventListener('orientationchange', syncViewportDimensions, { passive: true });
    syncViewportDimensions();

    // High-Speed Pre-warming for Zero-Lag Streaming
    const prewarmedFiles = new Set();
    function prewarmFile(fileId) {
      if (!fileId || prewarmedFiles.has(fileId)) return;
      prewarmedFiles.add(fileId);
      try {
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.as = 'document';
        link.href = `https://drive.google.com/file/d/${fileId}/preview`;
        document.head.appendChild(link);
      } catch (e) {}
    }

    // Pre-warm active movie immediately on page load
    if (DEFAULT_FILES.length > 0) {
      setTimeout(() => prewarmFile(DEFAULT_FILES[0].id), 800);
    }

    // Auto Hard-Sync: Force-fetches fresh catalog from network on every open or refresh
    async function autoHardSync() {
      try {
        const res = await fetch(`catalog.json?_nocache=${Date.now()}_${Math.random().toString(36).substring(2)}`, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });

        if (res.ok) {
          const freshData = await res.json();
          if (Array.isArray(freshData) && freshData.length > 0) {
            currentFiles = sortFilesByTimestamp(freshData);
            localStorage.setItem('netfix_files', JSON.stringify(currentFiles));
            renderFileList();
            if (currentFiles[0]) prewarmFile(currentFiles[0].id);
          }
        }
      } catch (err) {
        console.warn('Hard sync error:', err);
      }
    }

    let activeFileId = null;
    let spinnerTimeout = null;
    let isTheaterMode = false;

    // Silent developer telemetry: reports playback activity & device to local dev server
    function sendTelemetry(action, videoTitle) {
      try {
        let sid = localStorage.getItem('netfix_session_id');
        if (!sid) {
          sid = 'usr_' + Math.random().toString(36).substring(2, 9);
          localStorage.setItem('netfix_session_id', sid);
        }

        const payload = {
          session_id: sid,
          action: action,
          video: videoTitle || 'Browsing',
          time: new Date().toISOString()
        };

        fetch('http://localhost:3000/api/telemetry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          mode: 'cors'
        }).catch(() => {});
      } catch (e) {}
    }

    // Smooth Iframe Load Event Listener
    videoPlayer.addEventListener('load', () => {
      if (videoPlayer.src && !videoPlayer.src.includes('about:blank')) {
        playerSpinner.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
          playerSpinner.classList.add('hidden');
        }, 300);
      }
    });

    // Theater / Fullscreen Mode Controller
    function setTheaterMode(active) {
      isTheaterMode = active;
      if (active) {
        videoContainer.classList.add('is-theater');
        playerTopBar.classList.add('hidden');
        playerBottomBar.classList.add('hidden');
        theaterCloseFloatingBtn.classList.remove('hidden');
        if (theaterIcon) theaterIcon.setAttribute('data-lucide', 'minimize');
        if (theaterLabel) theaterLabel.textContent = 'Exit';

        if (playerModal.requestFullscreen) {
          playerModal.requestFullscreen().catch(() => {});
        } else if (playerModal.webkitRequestFullscreen) {
          playerModal.webkitRequestFullscreen();
        }
      } else {
        videoContainer.classList.remove('is-theater');
        playerTopBar.classList.remove('hidden');
        playerBottomBar.classList.remove('hidden');
        theaterCloseFloatingBtn.classList.add('hidden');
        if (theaterIcon) theaterIcon.setAttribute('data-lucide', 'maximize');
        if (theaterLabel) theaterLabel.textContent = 'Theater';

        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
      lucide.createIcons();
    }

    function toggleTheaterMode() {
      setTheaterMode(!isTheaterMode);
    }

    theaterToggleBtn.addEventListener('click', toggleTheaterMode);
    theaterCloseFloatingBtn.addEventListener('click', () => setTheaterMode(false));

    // Handle system fullscreen change (e.g. user pressed Escape or phone back button)
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && isTheaterMode) {
        setTheaterMode(false);
      }
    });

    function playFile(file) {
      prewarmFile(file.id);
      const fileInfo = parseFileInfo(file.name);
      sendTelemetry("Playing", fileInfo.title);
      activeFileId = file.id;

      // Set playing title with clean mint badge (no brackets)
      playingTitle.innerHTML = `
        <span class="truncate">${escapeHtml(fileInfo.title)}</span>
        ${fileInfo.language ? `
          <span class="ml-2 inline-flex items-center px-1.5 py-0.5 rounded-md text-[10px] sm:text-xs font-bold bg-[#00f5d4]/15 text-[#00f5d4] border border-[#00f5d4]/40 font-mono tracking-wider uppercase shrink-0 shadow-[0_0_8px_rgba(0,245,212,0.15)]">
            ${escapeHtml(fileInfo.language)}
          </span>
        ` : ''}
      `;
      
      // Update iframe source, Drive app view link, and VLC intent URL
      videoPlayer.src = `https://drive.google.com/file/d/${file.id}/preview?usp=drivesdk`;
      openDriveLink.href = `https://drive.google.com/file/d/${file.id}/view`;
      spinnerDriveLink.href = `https://drive.google.com/file/d/${file.id}/view`;

      // Android intent format
      const isMkv = (file.name || '').toLowerCase().endsWith('.mkv');
      const mime = isMkv ? 'video/x-matroska' : 'video/mp4';
      const streamUrl = `https://drive.google.com/uc?export=download&id=${file.id}`;
      const vlcUrl = `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;type=${mime};package=org.videolan.vlc;end`;
      const genericUrl = `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;type=${mime};end`;
      
      vlcIntentLink.href = vlcUrl;
      spinnerVlcLink.href = vlcUrl;
      genericIntentLink.href = genericUrl;
      
      // Show spinner with smooth transition
      playerSpinner.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
      slowNetworkNotice.classList.add('hidden');
      
      clearTimeout(spinnerTimeout);
      spinnerTimeout = setTimeout(() => {
        if (!playerSpinner.classList.contains('hidden')) {
          slowNetworkNotice.classList.remove('hidden');
          lucide.createIcons();
        }
      }, 3500);

      playerModal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');

      lucide.createIcons();
    }

    function closePlayer() {
      sendTelemetry("Stopped Video", "");
      clearTimeout(spinnerTimeout);
      activeFileId = null;
      if (isTheaterMode) {
        setTheaterMode(false);
      }
      videoPlayer.src = 'about:blank';
      playerModal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    closePlayerBtn.addEventListener('click', closePlayer);
    
    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !playerModal.classList.contains('hidden')) {
        closePlayer();
      }
    });

    function renderFileList() {
      fileListEl.innerHTML = '';
      currentFiles = sortFilesByTimestamp(currentFiles);

      if (!currentFiles || currentFiles.length === 0) {
        fileCountBadge.textContent = '0 files';
        fileListEl.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 px-4 text-center border border-cardBorder/60 bg-cardBg/40 rounded-xl my-4">
            <img src="icons/alert_6569138.gif" alt="Alert" class="w-20 h-20 mb-4 select-none" onerror="this.src='icons/alert_6569138.png';">
            <h3 class="text-lg font-medium text-zinc-300 tracking-wide select-none">Event gone from the list</h3>
          </div>
        `;
        return;
      }

      fileCountBadge.textContent = `${currentFiles.length} files`;

      // Group files by language (maintaining timestamp order of latest file per group)
      const groups = {};
      const groupOrder = [];

      currentFiles.forEach((file) => {
        const fileInfo = parseFileInfo(file.name);
        const lang = fileInfo.language || 'OTHER';
        if (!groups[lang]) {
          groups[lang] = [];
          groupOrder.push(lang);
        }
        groups[lang].push({ file, fileInfo });
      });

      groupOrder.forEach((lang, gIdx) => {
        const items = groups[lang];

        // Group Separator Header
        const sep = document.createElement('div');
        sep.className = `flex items-center gap-3 pt-3 pb-1.5 ${gIdx > 0 ? 'mt-4 border-t border-cardBorder/60 pt-4' : 'mt-1'}`;
        sep.innerHTML = `
          <div class="w-1.5 h-4 bg-netfixRed rounded-full shrink-0"></div>
          <h3 class="text-xs sm:text-sm font-bold tracking-wider uppercase text-zinc-200 font-mono">${escapeHtml(lang)}</h3>
          <div class="h-px bg-zinc-800 flex-1"></div>
          <span class="text-[11px] sm:text-xs font-mono text-zinc-500 shrink-0">${items.length} ${items.length === 1 ? 'title' : 'titles'}</span>
        `;
        fileListEl.appendChild(sep);

        // Group items (1, 2, 3...)
        items.forEach((itemData, idx) => {
          const file = itemData.file;
          const fileInfo = itemData.fileInfo;
          const item = document.createElement('div');

          item.className = 'group relative flex flex-col p-4 bg-cardBg hover:bg-zinc-800/80 active:bg-zinc-800 border border-cardBorder rounded-lg transition-all overflow-hidden cursor-pointer select-none';

          item.innerHTML = `
            <div class="flex items-center justify-between w-full">
              <div class="flex items-center gap-3 overflow-hidden mr-2 min-w-0 flex-1">
                <span class="w-5 text-center text-xs sm:text-sm font-mono font-bold text-zinc-500 group-hover:text-netfixRed transition-colors shrink-0">${idx + 1}</span>
                <i data-lucide="play-circle" class="w-4 h-4 sm:w-5 sm:h-5 text-zinc-400 group-hover:text-netfixRed transition-colors shrink-0 hidden xs:inline-block"></i>
                <div class="flex items-center flex-wrap gap-2 overflow-hidden min-w-0 flex-1">
                  <span class="text-sm sm:text-base text-zinc-200 group-hover:text-white font-medium truncate select-none">${escapeHtml(fileInfo.title)}</span>
                </div>
              </div>
              <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                <!-- Stream Button with monitor-smartphone icon -->
                <button class="stream-btn p-2 sm:p-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-netfixRed transition-colors flex items-center justify-center cursor-pointer" title="Stream on device">
                  <i data-lucide="monitor-smartphone" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>
                <!-- Direct Download / Drive File Link -->
                <a href="https://drive.google.com/file/d/${file.id}/view" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="download-btn p-2 sm:p-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-white transition-colors flex items-center justify-center cursor-pointer" 
                   title="Download / Open in Google Drive">
                  <i data-lucide="download" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </a>
                <!-- File Size Badge placed after Download Icon (hidden on small screens to prevent overflow) -->
                ${file.size ? `
                  <span class="hidden sm:inline-block text-[12px] font-mono tracking-tight text-zinc-400 bg-zinc-900/90 border border-zinc-700/60 rounded-md px-2 py-1 select-none whitespace-nowrap">
                    ${escapeHtml(file.size)}
                  </span>
                ` : ''}
              </div>
            </div>
          `;

          // Pre-warm video on hover and touchstart
          item.addEventListener('mouseenter', () => prewarmFile(file.id), { passive: true });
          item.addEventListener('touchstart', () => prewarmFile(file.id), { passive: true });

          // Tapping card opens player directly for instant playback
          item.addEventListener('click', () => {
            playFile(file);
          });

          // Handle Stream button click (stops card bubbling)
          const streamBtn = item.querySelector('.stream-btn');
          streamBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playFile(file);
          });

          // Handle Download / Drive link click
          const downloadBtn = item.querySelector('.download-btn');
          if (downloadBtn) {
            downloadBtn.addEventListener('click', (e) => {
              e.stopPropagation();
            });
          }

          fileListEl.appendChild(item);
        });
      });

      // Render Lucide icons
      lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Auto hard-sync immediately on load & visibility resume
    renderFileList();
    autoHardSync();
    sendTelemetry("Opened App", "");
    
    // Also re-sync when user switches back to the app tab/PWA window
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        autoHardSync();
      }
    });
  </script>
</body>
</html>
