<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NETFIX</title>
  
  <!-- Google Font: Strait -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Strait&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            strait: ['Strait', 'sans-serif'],
          },
          colors: {
            netfixRed: '#E50914',
            darkBg: '#0f0f0f',
            cardBg: '#181818',
            cardBorder: '#272727'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-netfixRed selection:text-white">

  <!-- Header -->
  <header class="w-full border-b border-cardBorder bg-black/60 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center">
      <h1 class="font-strait text-4xl sm:text-5xl tracking-widest text-netfixRed font-bold select-none cursor-pointer">
        NETFIX
      </h1>
    </div>
    
    <div class="flex items-center gap-3">
      <button id="refreshBtn" title="Refresh files" class="p-2.5 rounded-lg bg-cardBg hover:bg-zinc-800 border border-cardBorder transition-colors">
        <i data-lucide="refresh-cw" class="w-5 h-5 text-zinc-400 hover:text-white"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    
    <!-- Video Player Preview Container (Hidden by default, shown when stream is triggered) -->
    <div id="playerSection" class="hidden mb-8 rounded-xl overflow-hidden border border-cardBorder bg-black shadow-2xl">
      <div class="flex items-center justify-between px-4 py-3 bg-zinc-900 border-b border-cardBorder">
        <div class="flex items-center gap-2 overflow-hidden">
          <i data-lucide="monitor-smartphone" class="w-5 h-5 text-netfixRed shrink-0"></i>
          <span id="playingTitle" class="text-sm sm:text-base font-semibold truncate text-zinc-200">Playing</span>
        </div>
        <button id="closePlayerBtn" class="text-xs px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition-colors flex items-center gap-1">
          <i data-lucide="x" class="w-4 h-4"></i> Close
        </button>
      </div>
      <div class="relative w-full pb-[56.25%] bg-black">
        <iframe id="videoPlayer" class="absolute inset-0 w-full h-full border-0" allowfullscreen allow="autoplay"></iframe>
      </div>
    </div>

    <!-- Section Header: Trending Now with library-big icon -->
    <div class="flex items-center justify-between mb-6 pb-2 border-b border-cardBorder/60">
      <div class="flex items-center gap-2.5">
        <i data-lucide="library-big" class="w-5 h-5 text-netfixRed"></i>
        <h2 class="text-lg font-semibold tracking-wide text-zinc-300 uppercase">Trending Now</h2>
      </div>
      <span id="fileCountBadge" class="text-xs font-mono bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full border border-cardBorder">0 files</span>
    </div>

    <!-- List of File Names -->
    <div id="fileList" class="flex flex-col gap-2.5">
      <!-- File items will render here dynamically -->
    </div>
  </main>

  <!-- Hidden iframe for instant direct downloads without opening intermediate pages -->
  <iframe id="downloadFrame" class="hidden" style="display:none;"></iframe>

  <script>
    // Data list from your folder with verified file sizes
    const DEFAULT_FILES = [
      { id: "1m5V1-GA_a35qWoepvbJTlUVcqGovkfKA", name: "Baby Do Die Do 2026.mkv", size: "676.7 MB" },
      { id: "14iErC-cc2PYKiArlWwFj11jgdfKapGvg", name: "Dhamaal 4 2026.mkv", size: "1.14 GB" },
      { id: "15uzaISsm2qBqVmZttJHY8p7FiQNjzfbI", name: "Gandhari 2026.mkv", size: "1.10 GB" },
      { id: "1tkqIagYOndyOKCDx9XgeC_rFpc_Pcu91", name: "Ghamasaan 2026.mkv", size: "1.83 GB" }
    ];

    // Strip file extensions for clean display
    function cleanFileName(filename) {
      if (!filename) return '';
      return filename.replace(/\.(mp4|mkv|webm|avi|mov)$/i, '');
    }

    // LocalStorage initialization
    function getStoredFiles() {
      const stored = localStorage.getItem('netfix_files');
      if (stored) {
        try { return JSON.parse(stored); } catch (e) {}
      }
      localStorage.setItem('netfix_files', JSON.stringify(DEFAULT_FILES));
      return DEFAULT_FILES;
    }

    let currentFiles = getStoredFiles();

    const fileListEl = document.getElementById('fileList');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const playerSection = document.getElementById('playerSection');
    const videoPlayer = document.getElementById('videoPlayer');
    const playingTitle = document.getElementById('playingTitle');
    const closePlayerBtn = document.getElementById('closePlayerBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const downloadFrame = document.getElementById('downloadFrame');

    // Trigger direct 1-click download that bypasses Google's "File too large / Virus scan" warning page
    function triggerDownload(fileId) {
      // Direct media content delivery URL with confirm=t
      const directUrl = `https://drive.usercontent.google.com/download?id=${fileId}&export=download&confirm=t`;
      
      // Create a temporary link element to prompt native browser download manager
      const link = document.createElement('a');
      link.href = directUrl;
      link.setAttribute('download', '');
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function renderFileList() {
      fileListEl.innerHTML = '';
      fileCountBadge.textContent = `${currentFiles.length} files`;

      currentFiles.forEach((file) => {
        const item = document.createElement('div');
        item.className = 'group flex items-center justify-between p-4 bg-cardBg hover:bg-zinc-800/80 border border-cardBorder rounded-lg transition-all';
        
        const displayName = cleanFileName(file.name);

        item.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden mr-3">
            <i data-lucide="video" class="w-5 h-5 text-zinc-400 group-hover:text-netfixRed transition-colors shrink-0"></i>
            <span class="text-base text-zinc-200 group-hover:text-white font-medium truncate select-none">${escapeHtml(displayName)}</span>
            ${file.size ? `
              <span class="text-[11px] font-mono tracking-tight text-zinc-400 border border-zinc-700/80 rounded px-1.5 py-0.5 shrink-0 select-none">
                ${escapeHtml(file.size)}
              </span>
            ` : ''}
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <!-- Stream Button with monitor-smartphone icon -->
            <button class="stream-btn p-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-netfixRed transition-colors" title="Stream on device">
              <i data-lucide="monitor-smartphone" class="w-5 h-5"></i>
            </button>
            <!-- Direct Download Button with direct link -->
            <a href="https://drive.usercontent.google.com/download?id=${file.id}&export=download&confirm=t&authuser=0" 
               download="${displayName}"
               class="download-btn p-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-white transition-colors flex items-center justify-center" 
               title="Download">
              <i data-lucide="download" class="w-5 h-5"></i>
            </a>
          </div>
        `;

        // Handle Stream button click
        const streamBtn = item.querySelector('.stream-btn');
        streamBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          playFile(file);
        });

        fileListEl.appendChild(item);
      });

      // Render Lucide icons
      lucide.createIcons();
    }

    function playFile(file) {
      playingTitle.textContent = cleanFileName(file.name);
      videoPlayer.src = `https://drive.google.com/file/d/${file.id}/preview`;
      playerSection.classList.remove('hidden');
      playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      localStorage.setItem('netfix_last_played', JSON.stringify(file));
      lucide.createIcons();
    }

    closePlayerBtn.addEventListener('click', () => {
      videoPlayer.src = '';
      playerSection.classList.add('hidden');
    });

    refreshBtn.addEventListener('click', () => {
      currentFiles = getStoredFiles();
      renderFileList();
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial render
    renderFileList();
    lucide.createIcons();
  </script>
</body>
</html>
