  <style>
    :root {
      --app-dvh: 100dvh;
    }
    @supports not (height: 100dvh) {
      :root {
        --app-dvh: 100vh;
      }
    }
    /* Dynamic Player Sizing: mathematically ensures 16:9 ratio NEVER overflows viewport height in landscape or portrait */
    .player-box {
      width: 100%;
      max-width: min(98vw, 1280px, calc((var(--app-dvh) - 100px) * 16 / 9));
      aspect-ratio: 16 / 9;
      height: auto;
      max-height: calc(var(--app-dvh) - 100px);
      transform: translateZ(0);
    }
    /* Fullscreen Theater Mode */
    .player-box.is-theater {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100dvh !important;
      max-height: 100dvh !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 60 !important;
      aspect-ratio: auto !important;
    }
    /* Safe Area Insets for notched phones (iPhone, Galaxy S series, Pixel) */
    .safe-modal {
      padding-top: max(0.5rem, env(safe-area-inset-top));
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      padding-left: max(0.5rem, env(safe-area-inset-left));
      padding-right: max(0.5rem, env(safe-area-inset-right));
    }
    /* Smooth custom scrollbars */
    #playerModal::-webkit-scrollbar {
      width: 4px;
    }
    #playerModal::-webkit-scrollbar-thumb {
      background: #272727;
      border-radius: 4px;
    }
    /* Netflix Cascade Down-Stack Content Entrance */
    @keyframes netflixCascadeDown {
      0% {
        opacity: 0;
        transform: translateY(-28px) scale(0.97);
        filter: blur(3px);
      }
      60% {
        opacity: 0.95;
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }
    .animate-cascade-down {
      animation: netflixCascadeDown 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: transform, opacity;
    }
  </style>

    // Language Dictionary
    const LANGUAGE_MAP = {
      'HI': 'HINDI',
      'HINDI': 'HINDI',
      'HINIDI': 'HINDI',
      'EN': 'ENGLISH',
      'ENG': 'ENGLISH',
      'ENGLISH': 'ENGLISH',
      'MR': 'MARATHI',
      'MARATHI': 'MARATHI',
      'FR': 'FOREIGN',
      'FOREIGN': 'FOREIGN'
    };

    // Parse filename to extract language code & format clean title
    // Example: "Mirzapur The Movie 2026 (HI).mkv" => title: "Mirzapur The Movie 2026.mkv", language: "HINDI"
    // Parse filename to extract media metadata (Movies, TV Series, Seasons, Episodes, Language)
    function parseFileInfo(filename) {
      if (!filename) return { title: '', language: null, isSeries: false };

      const langRegex = /\s*[\(\[](HI|HINDI|HINIDI|EN|ENG|ENGLISH|MR|MARATHI|FR|FOREIGN)[\)\]]\s*/i;
      let language = null;
      let cleanFilename = filename;

      const langMatch = filename.match(langRegex);
      if (langMatch) {
        const rawKey = langMatch[1].toUpperCase();
        language = LANGUAGE_MAP[rawKey] || rawKey;
        cleanFilename = filename.replace(langRegex, ' ');
      }

      // Check for file extension
      const nameWithoutExt = cleanFilename.replace(/\.[a-z0-9]+$/i, '').trim();

      // Series & Episode Detection Patterns:
      // Pattern 1: S01E02 or S1E02 or S01EP02
      const sPattern1 = /^(.*?)(?:[\s._-]+|\b)S(\d{1,2})[\s._-]*E(?:P)?(\d{1,3})(?:[\s._-]+(.*))?$/i;
      // Pattern 2: Season 1 Episode 2
      const sPattern2 = /^(.*?)(?:[\s._-]+|\b)Season[\s._-]*(\d{1,2})[\s._-]*(?:Episode|Ep)?[\s._-]*(\d{1,3})(?:[\s._-]+(.*))?$/i;
      // Pattern 3: 1x02
      const sPattern3 = /^(.*?)(?:[\s._-]+|\b)(\d{1,2})x(\d{1,3})(?:[\s._-]+(.*))?$/i;

      const seriesMatch = nameWithoutExt.match(sPattern1) || nameWithoutExt.match(sPattern2) || nameWithoutExt.match(sPattern3);

      if (seriesMatch) {
        const seriesRaw = (seriesMatch[1] || '').trim();
        const seasonNum = parseInt(seriesMatch[2], 10);
        const episodeNum = parseInt(seriesMatch[3], 10);
        const epTitleRaw = (seriesMatch[4] || '').trim();

        const seriesTitle = seriesRaw.replace(/[\._]/g, ' ').replace(/\s+/g, ' ').trim() || 'Series';
        const episodeTitle = epTitleRaw.replace(/[\._]/g, ' ').replace(/\s+/g, ' ').trim();

        let displayTitle = `${seriesTitle} S${String(seasonNum).padStart(2, '0')}E${String(episodeNum).padStart(2, '0')}`;
        if (episodeTitle) {
          displayTitle += ` - ${episodeTitle}`;
        }

        return {
          title: displayTitle,
          rawTitle: filename,
          language: language,
          isSeries: true,
          seriesTitle: seriesTitle,
          season: seasonNum,
          episode: episodeNum,
          episodeTitle: episodeTitle ? `${episodeTitle}` : `Episode ${episodeNum}`
        };
      }

      // Standalone Movie
      const title = cleanFilename
        .replace(/\s+(\.[a-z0-9]+)$/i, (m, ext) => ext)
        .replace(/\s+/g, ' ')
        .trim();

      return {
        title: title,
        rawTitle: filename,
        language: language,
        isSeries: false
      };
    }

    // Sort files strictly by timestamp from Google Drive (newest timestamp first)
    function sortFilesByTimestamp(files) {
      if (!Array.isArray(files)) return [];
      return files.slice().sort((a, b) => {
        const tA = Number(a.timestamp || a.createdTime || 0);
        const tB = Number(b.timestamp || b.createdTime || 0);
        return tB - tA;
      });
    }

    // LocalStorage initialization - strictly purges all player progress / resume timeline storage
    function getStoredFiles() {
      try {
        localStorage.removeItem('netfix_last_played');
        localStorage.removeItem('netfix_watch_progress');
        localStorage.removeItem('fc_recent_watched');

        const cached = localStorage.getItem('netfix_files');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return sortFilesByTimestamp(parsed);
          }
        }
        localStorage.setItem('netfix_files', JSON.stringify(sortFilesByTimestamp(DEFAULT_FILES)));
      } catch (e) {}
      return sortFilesByTimestamp(DEFAULT_FILES);
    }

    let currentFiles = getStoredFiles();

    // Dynamic Viewport Dimensions Synchronizer (Handles orientation changes & mobile dynamic toolbars)
    function syncViewportDimensions() {
      const vh = window.innerHeight;
      document.documentElement.style.setProperty('--app-dvh', `${vh}px`);
    }
    window.addEventListener('resize', syncViewportDimensions, { passive: true });
    window.addEventListener('orientationchange', syncViewportDimensions, { passive: true });
    syncViewportDimensions();

    // High-Speed Pre-warming for Zero-Lag Streaming
    const prewarmedFiles = new Set();
    function prewarmFile(fileId) {
      if (!fileId || prewarmedFiles.has(fileId)) return;
      prewarmedFiles.add(fileId);
      try {
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.as = 'document';
        link.href = `https://drive.google.com/file/d/${fileId}/preview`;
        document.head.appendChild(link);
      } catch (e) {}
    }

    // Pre-warm active movie immediately on page load
    if (DEFAULT_FILES.length > 0) {
      setTimeout(() => prewarmFile(DEFAULT_FILES[0].id), 800);
    }

    // Auto Hard-Sync: Force-fetches fresh catalog from network on every open or refresh
    async function autoHardSync() {
      try {
        const res = await fetch(`catalog.json?_nocache=${Date.now()}_${Math.random().toString(36).substring(2)}`, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });

        if (res.ok) {
          const freshData = await res.json();
          if (Array.isArray(freshData) && freshData.length > 0) {
            currentFiles = sortFilesByTimestamp(freshData);
            localStorage.setItem('netfix_files', JSON.stringify(currentFiles));
            renderFileList();
            if (currentFiles[0]) prewarmFile(currentFiles[0].id);
          }
        }
      } catch (err) {
        console.warn('Hard sync error:', err);
      }
    }

    // Silent developer telemetry: reports playback activity & device to local dev server
    function sendTelemetry(action, videoTitle) {
      try {
        let sid = localStorage.getItem('netfix_session_id');
        if (!sid) {
          sid = 'usr_' + Math.random().toString(36).substring(2, 9);
          localStorage.setItem('netfix_session_id', sid);
        }

        const payload = {
          session_id: sid,
          action: action,
          video: videoTitle || 'Browsing',
          time: new Date().toISOString()
        };

        fetch('http://localhost:3000/api/telemetry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          mode: 'cors'
        }).catch(() => {});
      } catch (e) {}
    }

    // Smooth Iframe Load Event Listener
    videoPlayer.addEventListener('load', () => {
      if (videoPlayer.src && !videoPlayer.src.includes('about:blank')) {
        playerSpinner.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
          playerSpinner.classList.add('hidden');
        }, 300);
      }
    });

    // Theater / Fullscreen Mode Controller
    function setTheaterMode(active) {
      isTheaterMode = active;
      if (active) {
        videoContainer.classList.add('is-theater');
        playerTopBar.classList.add('hidden');
        playerBottomBar.classList.add('hidden');
        theaterCloseFloatingBtn.classList.remove('hidden');
        if (theaterIcon) theaterIcon.setAttribute('data-lucide', 'minimize');
        if (theaterLabel) theaterLabel.textContent = 'Exit';

        if (playerModal.requestFullscreen) {
          playerModal.requestFullscreen().catch(() => {});
        } else if (playerModal.webkitRequestFullscreen) {
          playerModal.webkitRequestFullscreen();
        }
      } else {
        videoContainer.classList.remove('is-theater');
        playerTopBar.classList.remove('hidden');
        playerBottomBar.classList.remove('hidden');
        theaterCloseFloatingBtn.classList.add('hidden');
        if (theaterIcon) theaterIcon.setAttribute('data-lucide', 'maximize');
        if (theaterLabel) theaterLabel.textContent = 'Theater';

        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
      lucide.createIcons();
    }

    function toggleTheaterMode() {
      setTheaterMode(!isTheaterMode);
    }

    theaterToggleBtn.addEventListener('click', toggleTheaterMode);
    theaterCloseFloatingBtn.addEventListener('click', () => setTheaterMode(false));

    // Handle system fullscreen change (e.g. user pressed Escape or phone back button)
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && isTheaterMode) {
        setTheaterMode(false);
      }
    });

    function playFile(file) {
      prewarmFile(file.id);
      const fileInfo = parseFileInfo(file.name);
      sendTelemetry("Playing", fileInfo.title);
      activeFileId = file.id;

      // Set playing title with clean mint badge (no brackets)
      playingTitle.innerHTML = `
        <span class="truncate">${escapeHtml(fileInfo.title)}</span>
        ${fileInfo.language ? `
          <span class="ml-2 inline-flex items-center px-1.5 py-0.5 rounded-md text-[10px] sm:text-xs font-bold bg-[#00f5d4]/15 text-[#00f5d4] border border-[#00f5d4]/40 font-mono tracking-wider uppercase shrink-0 shadow-[0_0_8px_rgba(0,245,212,0.15)]">
            ${escapeHtml(fileInfo.language)}
          </span>
        ` : ''}
      `;
      
      // Update iframe source, Drive app view link, and VLC intent URL
      videoPlayer.src = `https://drive.google.com/file/d/${file.id}/preview?usp=drivesdk`;
      openDriveLink.href = `https://drive.google.com/file/d/${file.id}/view`;
      spinnerDriveLink.href = `https://drive.google.com/file/d/${file.id}/view`;

      // Android intent format
      const isMkv = (file.name || '').toLowerCase().endsWith('.mkv');
      const mime = isMkv ? 'video/x-matroska' : 'video/mp4';
      const streamUrl = `https://drive.google.com/uc?export=download&id=${file.id}`;
      const vlcUrl = `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;type=${mime};package=org.videolan.vlc;end`;
      const genericUrl = `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;type=${mime};end`;
      
      vlcIntentLink.href = vlcUrl;
      spinnerVlcLink.href = vlcUrl;
      genericIntentLink.href = genericUrl;
      
      // Show spinner with smooth transition
      playerSpinner.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
      slowNetworkNotice.classList.add('hidden');
      
      clearTimeout(spinnerTimeout);
      spinnerTimeout = setTimeout(() => {
        if (!playerSpinner.classList.contains('hidden')) {
          slowNetworkNotice.classList.remove('hidden');
          lucide.createIcons();
        }
      }, 3500);

      playerModal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');

      lucide.createIcons();
    }

    function closePlayer() {
      sendTelemetry("Stopped Video", "");
      clearTimeout(spinnerTimeout);
      activeFileId = null;
      if (isTheaterMode) {
        setTheaterMode(false);
      }
      videoPlayer.src = 'about:blank';
      playerModal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    closePlayerBtn.addEventListener('click', closePlayer);
    
    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !playerModal.classList.contains('hidden')) {
        closePlayer();
      }
    });

    let hasAnimatedEntrance = false;

    function renderFileList(forceAnimate = false) {
      fileListEl.innerHTML = '';
      currentFiles = sortFilesByTimestamp(currentFiles);

      if (!currentFiles || currentFiles.length === 0) {
        fileCountBadge.textContent = '0 files';
        fileListEl.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 px-4 text-center border border-cardBorder/60 bg-cardBg/40 rounded-xl my-4">
            <img src="icons/alert_6569138.gif" alt="Alert" class="w-20 h-20 mb-4 select-none" onerror="this.src='icons/alert_6569138.png';">
            <h3 class="text-lg font-medium text-zinc-300 tracking-wide select-none">Event gone from the list</h3>
          </div>
        `;
        return;
      }

      fileCountBadge.textContent = `${currentFiles.length} files`;

      const shouldAnimate = !hasAnimatedEntrance || forceAnimate;
      if (shouldAnimate) {
        hasAnimatedEntrance = true;
      }

      // Group files by language (maintaining timestamp order of latest file per language)
      const groups = {};
      const groupOrder = [];

      currentFiles.forEach((file) => {
        const fileInfo = parseFileInfo(file.name);
        const lang = fileInfo.language || 'OTHER';
        if (!groups[lang]) {
          groups[lang] = [];
          groupOrder.push(lang);
        }
        groups[lang].push({ file, fileInfo });
      });

      let globalAnimIndex = 0;
      const baseDelay = 0.04;
      const staggerDelay = 0.06;

      groupOrder.forEach((lang, gIdx) => {
        const groupFiles = groups[lang];

        // Within this language, group TV Series vs Standalone Movies
        const seriesMap = new Map();
        const entries = [];

        groupFiles.forEach((item) => {
          const { file, fileInfo } = item;
          if (fileInfo.isSeries) {
            const seriesKey = fileInfo.seriesTitle.toLowerCase();
            if (!seriesMap.has(seriesKey)) {
              const seriesEntry = {
                type: 'series',
                seriesTitle: fileInfo.seriesTitle,
                seasons: {},
                latestTimestamp: Number(file.timestamp || file.createdTime || 0),
                totalEpisodes: 0
              };
              seriesMap.set(seriesKey, seriesEntry);
              entries.push(seriesEntry);
            }
            const sEntry = seriesMap.get(seriesKey);
            const sNum = fileInfo.season;
            if (!sEntry.seasons[sNum]) {
              sEntry.seasons[sNum] = [];
            }
            sEntry.seasons[sNum].push({ file, fileInfo });
            sEntry.totalEpisodes++;
            sEntry.latestTimestamp = Math.max(sEntry.latestTimestamp, Number(file.timestamp || file.createdTime || 0));
          } else {
            entries.push({
              type: 'movie',
              file: file,
              fileInfo: fileInfo,
              latestTimestamp: Number(file.timestamp || file.createdTime || 0)
            });
          }
        });

        // Sort entries by newest timestamp
        entries.sort((a, b) => b.latestTimestamp - a.latestTimestamp);

        // Group Separator Header
        const sep = document.createElement('div');
        const sepAnimClass = shouldAnimate ? 'animate-cascade-down' : '';
        sep.className = `flex items-center gap-3 pt-3 pb-1.5 ${sepAnimClass} ${gIdx > 0 ? 'mt-4 border-t border-cardBorder/60 pt-4' : 'mt-1'}`;
        if (shouldAnimate) {
          sep.style.animationDelay = `${(baseDelay + globalAnimIndex * staggerDelay).toFixed(3)}s`;
        }
        sep.innerHTML = `
          <div class="w-1.5 h-4 bg-netfixRed rounded-full shrink-0"></div>
          <h3 class="text-xs sm:text-sm font-bold tracking-wider uppercase text-zinc-200 font-mono">${escapeHtml(lang)}</h3>
          <div class="h-px bg-zinc-800 flex-1"></div>
          <span class="text-[11px] sm:text-xs font-mono text-zinc-500 shrink-0">${entries.length} ${entries.length === 1 ? 'title' : 'titles'} • ${groupFiles.length} files</span>
        `;
        fileListEl.appendChild(sep);
        globalAnimIndex++;

        // Render each entry (Movie or Model 1 Expandable Series Card)
        entries.forEach((entry, entryIdx) => {
          if (entry.type === 'movie') {
            const file = entry.file;
            const fileInfo = entry.fileInfo;
            const item = document.createElement('div');

            const itemAnimClass = shouldAnimate ? 'animate-cascade-down' : '';
            item.className = `group relative flex flex-col p-4 bg-cardBg hover:bg-zinc-800/80 active:bg-zinc-800 border border-cardBorder rounded-lg transition-colors overflow-hidden cursor-pointer select-none ${itemAnimClass}`;
            if (shouldAnimate) {
              item.style.animationDelay = `${(baseDelay + globalAnimIndex * staggerDelay).toFixed(3)}s`;
            }

            item.innerHTML = `
              <div class="flex items-center justify-between w-full">
                <div class="flex items-center gap-3 overflow-hidden mr-2 min-w-0 flex-1">
                  <span class="w-5 text-center text-xs sm:text-sm font-mono font-bold text-zinc-500 group-hover:text-netfixRed transition-colors shrink-0">${entryIdx + 1}</span>
                  <i data-lucide="play-circle" class="w-4 h-4 sm:w-5 sm:h-5 text-zinc-400 group-hover:text-netfixRed transition-colors shrink-0 hidden xs:inline-block"></i>
                  <div class="flex items-center flex-wrap gap-2 overflow-hidden min-w-0 flex-1">
                    <span class="text-sm sm:text-base text-zinc-200 group-hover:text-white font-medium truncate select-none">${escapeHtml(fileInfo.title)}</span>
                  </div>
                </div>
                <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                  <button class="stream-btn p-2 sm:p-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-netfixRed transition-colors flex items-center justify-center cursor-pointer" title="Stream on device">
                    <i data-lucide="monitor-smartphone" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                  </button>
                  <a href="https://drive.google.com/file/d/${file.id}/view" target="_blank" rel="noopener noreferrer" class="download-btn p-2 sm:p-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-white transition-colors flex items-center justify-center cursor-pointer" title="Download / Open in Google Drive">
                    <i data-lucide="download" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                  </a>
                  ${file.size ? `
                    <span class="hidden sm:inline-block text-[12px] font-mono tracking-tight text-zinc-400 bg-zinc-900/90 border border-zinc-700/60 rounded-md px-2 py-1 select-none whitespace-nowrap">
                      ${escapeHtml(file.size)}
                    </span>
                  ` : ''}
                </div>
              </div>
            `;

            item.addEventListener('mouseenter', () => prewarmFile(file.id), { passive: true });
            item.addEventListener('touchstart', () => prewarmFile(file.id), { passive: true });
            item.addEventListener('click', () => playFile(file));

            const streamBtn = item.querySelector('.stream-btn');
            streamBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              playFile(file);
            });

            const downloadBtn = item.querySelector('.download-btn');
            if (downloadBtn) {
              downloadBtn.addEventListener('click', (e) => e.stopPropagation());
            }

            fileListEl.appendChild(item);
            globalAnimIndex++;

          } else if (entry.type === 'series') {
            // Model 1: Expandable Series Card (Accordion)
            const series = entry;
            const seasonKeys = Object.keys(series.seasons).map(Number).sort((a, b) => a - b);
            let activeSeason = seasonKeys[0] || 1;

            // Sort episodes in each season
            seasonKeys.forEach(s => {
              series.seasons[s].sort((a, b) => a.fileInfo.episode - b.fileInfo.episode);
            });

            const seriesContainer = document.createElement('div');
            const itemAnimClass = shouldAnimate ? 'animate-cascade-down' : '';
            seriesContainer.className = `border border-cardBorder rounded-lg overflow-hidden bg-cardBg transition-all select-none ${itemAnimClass}`;
            if (shouldAnimate) {
              seriesContainer.style.animationDelay = `${(baseDelay + globalAnimIndex * staggerDelay).toFixed(3)}s`;
            }

            const seasonCount = seasonKeys.length;
            const epWord = series.totalEpisodes === 1 ? 'Ep' : 'Eps';
            const seasonWord = seasonCount === 1 ? 'Season' : 'Seasons';

            seriesContainer.innerHTML = `
              <!-- Series Header Card -->
              <div class="series-header flex items-center justify-between p-3.5 sm:p-4 hover:bg-zinc-800/60 active:bg-zinc-800 cursor-pointer select-none transition-colors">
                <div class="flex items-center gap-3 overflow-hidden mr-2 min-w-0 flex-1">
                  <span class="w-5 text-center text-xs sm:text-sm font-mono font-bold text-zinc-500 group-hover:text-netfixRed transition-colors shrink-0">${entryIdx + 1}</span>
                  <div class="w-8 h-8 rounded-lg bg-netfixRed/10 border border-netfixRed/30 flex items-center justify-center shrink-0">
                    <i data-lucide="tv-2" class="w-4 h-4 text-netfixRed"></i>
                  </div>
                  <div class="flex items-center flex-wrap gap-2 overflow-hidden min-w-0 flex-1">
                    <span class="text-sm sm:text-base font-bold text-white tracking-wide truncate">${escapeHtml(series.seriesTitle)}</span>
                    <span class="text-[10px] sm:text-[11px] font-mono font-bold uppercase bg-netfixRed/15 text-netfixRed border border-netfixRed/40 px-2 py-0.5 rounded-full shrink-0">
                      Series • ${seasonCount} ${seasonWord} (${series.totalEpisodes} ${epWord})
                    </span>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <span class="expand-label text-xs font-mono text-zinc-400 hidden sm:inline">Tap to open</span>
                  <div class="chevron-wrap w-7 h-7 rounded-full bg-zinc-900 border border-cardBorder flex items-center justify-center transition-transform duration-200 text-zinc-400">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                  </div>
                </div>
              </div>

              <!-- Inline Accordion Drawer -->
              <div class="accordion-drawer hidden border-t border-cardBorder/80 bg-[#121212] p-3 sm:p-4 space-y-3">
                ${seasonCount > 1 ? `
                  <div class="flex items-center justify-between pb-2 border-b border-cardBorder/60">
                    <div class="season-pills-wrap flex items-center gap-1.5 overflow-x-auto py-1">
                      ${seasonKeys.map(s => `
                        <button class="season-pill-btn px-3 py-1 rounded-md text-xs font-mono font-bold transition-all ${s === activeSeason ? 'bg-netfixRed text-white shadow-sm' : 'bg-zinc-900 text-zinc-400 hover:text-white border border-cardBorder'}" data-season="${s}">
                          Season ${s} (${series.seasons[s].length} Eps)
                        </button>
                      `).join('')}
                    </div>
                    <span class="text-[11px] font-mono text-zinc-500 hidden xs:inline">E01 &rarr; E${String(series.seasons[activeSeason].length).padStart(2, '0')}</span>
                  </div>
                ` : ''}

                <!-- Down-Stack Episode List -->
                <div class="episodes-stack space-y-2">
                </div>
              </div>
            `;

            const episodesStackEl = seriesContainer.querySelector('.episodes-stack');
            const drawerEl = seriesContainer.querySelector('.accordion-drawer');
            const chevronEl = seriesContainer.querySelector('.chevron-wrap');
            const expandLabel = seriesContainer.querySelector('.expand-label');
            const seriesHeader = seriesContainer.querySelector('.series-header');

            function renderSeasonEpisodes(sNum) {
              episodesStackEl.innerHTML = '';
              const epList = series.seasons[sNum] || [];

              epList.forEach(itemData => {
                const epFile = itemData.file;
                const epInfo = itemData.fileInfo;
                const epRow = document.createElement('div');
                epRow.className = 'group/ep flex items-center justify-between p-2.5 sm:p-3 bg-cardBg hover:bg-zinc-800/80 active:bg-zinc-800 border border-cardBorder rounded-lg transition-colors cursor-pointer select-none';

                epRow.innerHTML = `
                  <div class="flex items-center gap-2.5 sm:gap-3 overflow-hidden mr-2 min-w-0 flex-1">
                    <span class="text-xs font-mono font-bold text-netfixRed bg-netfixRed/10 border border-netfixRed/25 px-2 py-0.5 rounded shrink-0">
                      E${String(epInfo.episode).padStart(2, '0')}
                    </span>
                    <span class="text-xs sm:text-sm font-medium text-zinc-200 group-hover/ep:text-white truncate">
                      ${escapeHtml(epInfo.episodeTitle)}
                    </span>
                  </div>
                  <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
                    <button class="ep-stream-btn p-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-netfixRed transition-colors cursor-pointer" title="Stream Episode">
                      <i data-lucide="monitor-smartphone" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    </button>
                    <a href="https://drive.google.com/file/d/${epFile.id}/view" target="_blank" rel="noopener noreferrer" class="ep-download-btn p-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-white transition-colors cursor-pointer" title="Download / Open in Google Drive">
                      <i data-lucide="download" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    </a>
                    ${epFile.size ? `
                      <span class="hidden xs:inline-block text-[11px] font-mono text-zinc-400 bg-zinc-900/90 border border-zinc-700/60 rounded px-1.5 py-0.5 select-none whitespace-nowrap">
                        ${escapeHtml(epFile.size)}
                      </span>
                    ` : ''}
                  </div>
                `;

                epRow.addEventListener('mouseenter', () => prewarmFile(epFile.id), { passive: true });
                epRow.addEventListener('touchstart', () => prewarmFile(epFile.id), { passive: true });
                epRow.addEventListener('click', () => playFile(epFile));

                const epStreamBtn = epRow.querySelector('.ep-stream-btn');
                epStreamBtn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  playFile(epFile);
                });

                const epDownBtn = epRow.querySelector('.ep-download-btn');
                if (epDownBtn) {
                  epDownBtn.addEventListener('click', (e) => e.stopPropagation());
                }

                episodesStackEl.appendChild(epRow);
              });

              lucide.createIcons();
            }

            renderSeasonEpisodes(activeSeason);

            let isOpen = false;
            seriesHeader.addEventListener('click', () => {
              isOpen = !isOpen;
              if (isOpen) {
                drawerEl.classList.remove('hidden');
                chevronEl.classList.add('rotate-180');
                seriesContainer.classList.add('border-netfixRed/40');
                if (expandLabel) expandLabel.textContent = 'Tap to collapse';
                lucide.createIcons();
              } else {
                drawerEl.classList.add('hidden');
                chevronEl.classList.remove('rotate-180');
                seriesContainer.classList.remove('border-netfixRed/40');
                if (expandLabel) expandLabel.textContent = 'Tap to open';
              }
            });

            const pillBtns = seriesContainer.querySelectorAll('.season-pill-btn');
            pillBtns.forEach(btn => {
              btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const s = Number(btn.getAttribute('data-season'));
                activeSeason = s;
                pillBtns.forEach(b => {
                  b.className = (Number(b.getAttribute('data-season')) === s)
                    ? 'season-pill-btn px-3 py-1 rounded-md text-xs font-mono font-bold transition-all bg-netfixRed text-white shadow-sm'
                    : 'season-pill-btn px-3 py-1 rounded-md text-xs font-mono font-bold transition-all bg-zinc-900 text-zinc-400 hover:text-white border border-cardBorder';
                });
                renderSeasonEpisodes(s);
              });
            });

            fileListEl.appendChild(seriesContainer);
            globalAnimIndex++;
          }
        });
      });

      // Render Lucide icons
      lucide.createIcons();
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Auto hard-sync immediately on load & visibility resume
    renderFileList();
    autoHardSync();
    sendTelemetry("Opened App", "");
    
    // Also re-sync when user switches back to the app tab/PWA window
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        autoHardSync();
      }
    });
  </script>
</body>
</html>
