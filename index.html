<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NETFIX</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <!-- Google Font: Strait -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Strait&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            strait: ['Strait', 'sans-serif'],
          },
          colors: {
            netfixRed: '#E50914',
            darkBg: '#0f0f0f',
            cardBg: '#181818',
            cardBorder: '#272727'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-netfixRed selection:text-white">

  <!-- Header -->
  <header class="w-full border-b border-cardBorder bg-black/60 backdrop-blur-md sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center">
      <h1 class="font-strait text-4xl sm:text-5xl tracking-widest text-netfixRed font-bold select-none cursor-pointer">
        NETFIX
      </h1>
    </div>
  </header>

  <!-- Fullscreen Modal Video Player (Clean centered theater experience) -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-[#0d0d0d]/95 backdrop-blur-md flex flex-col items-center justify-center p-4 sm:p-6 hidden">
    <!-- Top Bar inside modal -->
    <div class="w-full max-w-[min(94vw,1280px)] flex items-center justify-between mb-3 px-1">
      <div class="flex items-center gap-2 overflow-hidden mr-4">
        <i data-lucide="monitor-smartphone" class="w-5 h-5 text-netfixRed shrink-0"></i>
        <span id="playingTitle" class="text-base sm:text-lg font-semibold truncate text-zinc-100 font-sans"></span>
      </div>
      <button id="closePlayerBtn" class="px-3.5 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 hover:text-white transition-colors flex items-center gap-1.5 text-sm font-medium border border-cardBorder cursor-pointer">
        <i data-lucide="x" class="w-4 h-4"></i> Close
      </button>
    </div>

    <!-- Centered 16:9 Custom Player -->
    <div class="w-full max-w-[min(94vw,1280px)] aspect-video rounded-xl overflow-hidden shadow-2xl border border-zinc-800 bg-black">
      <iframe
        id="videoPlayer"
        class="w-full h-full border-0 rounded-xl"
        src=""
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">

    <!-- Section Header: Trending Now with library-big icon -->
    <div class="flex items-center justify-between mb-6 pb-2 border-b border-cardBorder/60">
      <div class="flex items-center gap-2.5">
        <i data-lucide="library-big" class="w-5 h-5 text-netfixRed"></i>
        <h2 class="text-lg font-semibold tracking-wide text-zinc-300 uppercase">Trending Now</h2>
      </div>
      <span id="fileCountBadge" class="text-xs font-mono bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full border border-cardBorder">0 files</span>
    </div>

    <!-- List of File Names -->
    <div id="fileList" class="flex flex-col gap-2.5">
      <!-- File items will render here dynamically -->
    </div>
  </main>

  <!-- Hidden iframe for instant direct downloads without opening intermediate pages -->
  <iframe id="downloadFrame" class="hidden" style="display:none;"></iframe>

  <script>
    // Verified active files from your Google Drive folder
    const DEFAULT_FILES = [
      {
            "id": "1WlcrBRKLEQibT0_4hR3N0ilGbKj1970A",
            "name": "Mirzapur The Movie 2026.mkv",
            "size": "",
            "mimeType": "video/x-matroska"
      }
];

    // Strip file extensions for clean display
    function cleanFileName(filename) {
      if (!filename) return '';
      return filename.replace(/\.(mp4|mkv|webm|avi|mov)$/i, '');
    }

    // LocalStorage initialization
    function getStoredFiles() {
      const stored = localStorage.getItem('netfix_files');
      if (stored) {
        try { return JSON.parse(stored); } catch (e) {}
      }
      localStorage.setItem('netfix_files', JSON.stringify(DEFAULT_FILES));
      return DEFAULT_FILES;
    }

    let currentFiles = getStoredFiles();

    const fileListEl = document.getElementById('fileList');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const playerModal = document.getElementById('playerModal');
    const videoPlayer = document.getElementById('videoPlayer');
    const playingTitle = document.getElementById('playingTitle');
    const closePlayerBtn = document.getElementById('closePlayerBtn');

    // Auto Hard-Sync: Force-fetches fresh catalog from network on every open or refresh
    async function autoHardSync() {
      try {
        const res = await fetch(`catalog.json?_nocache=${Date.now()}_${Math.random().toString(36).substring(2)}`, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });

        if (res.ok) {
          const freshData = await res.json();
          if (Array.isArray(freshData) && freshData.length > 0) {
            currentFiles = freshData;
            localStorage.setItem('netfix_files', JSON.stringify(freshData));
            renderFileList();
          }
        }
      } catch (err) {
        console.warn('Hard sync error:', err);
      }
    }

    function playFile(file) {
      playingTitle.textContent = cleanFileName(file.name);
      videoPlayer.src = `https://drive.google.com/file/d/${file.id}/preview`;
      playerModal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
      localStorage.setItem('netfix_last_played', JSON.stringify(file));
      lucide.createIcons();
    }

    function closePlayer() {
      videoPlayer.src = '';
      playerModal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    closePlayerBtn.addEventListener('click', closePlayer);
    
    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !playerModal.classList.contains('hidden')) {
        closePlayer();
      }
    });

    // Automatically clicks through "Download Anyway" in the background
    function triggerDownloadAnyway(fileId) {
      // Create hidden iframe target
      let targetFrame = document.getElementById('autoDownloadFrame');
      if (!targetFrame) {
        targetFrame = document.createElement('iframe');
        targetFrame.id = 'autoDownloadFrame';
        targetFrame.style.display = 'none';
        document.body.appendChild(targetFrame);
      }

      // Submit direct download form directly to Google usercontent
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = 'https://drive.usercontent.google.com/download';
      form.target = 'autoDownloadFrame';

      const params = {
        id: fileId,
        export: 'download',
        confirm: 't'
      };

      for (const [k, v] of Object.entries(params)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = v;
        form.appendChild(input);
      }

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    function renderFileList() {
      fileListEl.innerHTML = '';

      if (!currentFiles || currentFiles.length === 0) {
        fileCountBadge.textContent = '0 files';
        fileListEl.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 px-4 text-center border border-cardBorder/60 bg-cardBg/40 rounded-xl my-4">
            <img src="icons/alert_6569138.gif" alt="Alert" class="w-20 h-20 mb-4 select-none" onerror="this.src='icons/alert_6569138.png';">
            <h3 class="text-lg font-medium text-zinc-300 tracking-wide select-none">Event gone from the list</h3>
          </div>
        `;
        return;
      }

      fileCountBadge.textContent = `${currentFiles.length} files`;

      currentFiles.forEach((file) => {
        const item = document.createElement('div');
        item.className = 'group flex items-center justify-between p-4 bg-cardBg hover:bg-zinc-800/80 border border-cardBorder rounded-lg transition-all';
        
        const displayName = cleanFileName(file.name);

        item.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden mr-3">
            <i data-lucide="video" class="w-5 h-5 text-zinc-400 group-hover:text-netfixRed transition-colors shrink-0"></i>
            <span class="text-base text-zinc-200 group-hover:text-white font-medium truncate select-none">${escapeHtml(displayName)}</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <!-- Stream Button with monitor-smartphone icon -->
            <button class="stream-btn p-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-netfixRed transition-colors flex items-center justify-center" title="Stream on device">
              <i data-lucide="monitor-smartphone" class="w-5 h-5"></i>
            </button>
            <!-- Direct Download Button (Auto-Bypass "Download Anyway") -->
            <button class="download-btn p-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-cardBorder text-zinc-400 hover:text-white transition-colors flex items-center justify-center" title="Download">
              <i data-lucide="download" class="w-5 h-5"></i>
            </button>
            <!-- File Size Badge placed after Download Icon -->
            ${file.size ? `
              <span class="text-[12px] font-mono tracking-tight text-zinc-400 bg-zinc-900/90 border border-zinc-700/60 rounded-md px-2 py-1 select-none whitespace-nowrap">
                ${escapeHtml(file.size)}
              </span>
            ` : ''}
          </div>
        `;

        // Handle Stream button click
        const streamBtn = item.querySelector('.stream-btn');
        streamBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          playFile(file);
        });

        // Handle Download: Auto submits Google confirmation form to trigger "Download Anyway" immediately
        const downloadBtn = item.querySelector('.download-btn');
        downloadBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          triggerDownloadAnyway(file.id);
        });

        fileListEl.appendChild(item);
      });

      // Render Lucide icons
      lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Auto hard-sync immediately on load & visibility resume
    renderFileList();
    autoHardSync();
    
    // Also re-sync when user switches back to the app tab/PWA window
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        autoHardSync();
      }
    });
  </script>
</body>
</html>
